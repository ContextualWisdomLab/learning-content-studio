name: Learning Content Studio Quality

on:
  pull_request:
    branches: [develop, main, "agent/**"]
  push:
    branches: [develop, main, "agent/**"]

permissions:
  contents: read

concurrency:
  group: learning-content-studio-quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Validate product contract
        shell: python3 {0}
        run: |
          from pathlib import Path

          required = [
              Path("README.md"),
              Path("AGENTS.md"),
              Path("CLAUDE.md"),
              Path("CHANGELOG.md"),
              Path("Cargo.toml"),
              Path("src/lib.rs"),
              Path("tests/publication_admission.rs"),
              Path("docs/PRD.md"),
              Path("docs/TRD.md"),
              Path("docs/ARCHITECTURE.md"),
              Path("docs/adr/0001-authoring-release-boundary.md"),
              Path("docs/doctoring/STANDARD_TRACEABILITY.md"),
              Path("docs/PUBLISHING.md"),
              Path("docs/product-technical-gap-baseline.md"),
          ]
          missing = [str(path) for path in required if not path.is_file()]
          if missing:
              raise SystemExit(f"missing required product files: {missing}")

          architecture = Path("docs/ARCHITECTURE.md").read_text(encoding="utf-8")
          required_terms = (
              "authoring",
              "immutable",
              "release",
              "accessibility",
              "publisher",
              "Publication Admission",
          )
          absent = [term for term in required_terms if term.lower() not in architecture.lower()]
          if absent:
              raise SystemExit(f"LCMS architecture is missing release/admission terms: {absent}")

          forbidden = ("TODO: replace", "TBD: replace", "PLACEHOLDER_REPLACE")
          for path in required:
              text = path.read_text(encoding="utf-8")
              for marker in forbidden:
                  if marker in text:
                      raise SystemExit(f"unresolved product marker {marker!r} in {path}")

          print("learning content studio product contract validation passed")
      - name: Verify Rust formatting
        run: cargo fmt --check
      - name: Verify Rust lint contract
        run: cargo clippy --all-targets -- -D warnings
      - name: Run publication kernel tests
        run: cargo test --all-targets
      - name: Install pinned coverage tool
        uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf # v2.87.2
        with:
          tool: cargo-llvm-cov@0.9.0
          fallback: none
      - name: Install pinned branch-coverage toolchain
        run: rustup toolchain install nightly-2026-08-30 --profile minimal --component llvm-tools-preview
      - name: Enforce 100 percent line and branch coverage
        shell: python3 {0}
        run: |
          import json
          import subprocess
          from pathlib import Path

          report_path = Path("target/llvm-cov/coverage.json")
          report_path.parent.mkdir(parents=True, exist_ok=True)
          subprocess.run(
              [
                  "cargo",
                  "+nightly-2026-08-30",
                  "llvm-cov",
                  "--all-targets",
                  "--branch",
                  "--fail-under-lines",
                  "100",
                  "--summary-only",
                  "--json",
                  "--output-path",
                  str(report_path),
              ],
              check=True,
          )
          with report_path.open(encoding="utf-8") as handle:
              report = json.load(handle)
          data = report.get("data") or []
          if len(data) != 1:
              raise SystemExit(f"expected one LLVM coverage data set, got {len(data)}")
          branches = (data[0].get("totals") or {}).get("branches") or {}
          covered = branches.get("covered")
          count = branches.get("count")
          if not isinstance(covered, int) or not isinstance(count, int) or count <= 0:
              raise SystemExit(f"branch coverage evidence missing or malformed: {branches}")
          if covered != count:
              raise SystemExit(f"branch coverage below 100%: {covered}/{count}")
          print(f"line coverage >=100%; branch coverage {covered}/{count} (100%)")
      - name: Verify public API documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps
